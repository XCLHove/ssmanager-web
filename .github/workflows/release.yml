name: Release

# 推送 v* 标签时触发：构建并发布 Release 资产，同时构建并推送 Docker 镜像到 GHCR
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build release assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            api/pnpm-lock.yaml
            ui/pnpm-lock.yaml

      - name: Build frontend
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile --config.strictDepBuilds=false
          pnpm build

      - name: Build API bundle (with unix-dgram)
        working-directory: api
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          pnpm install --frozen-lockfile --config.strictDepBuilds=false
          pnpm approve-builds --all
          pnpm rebuild
          pnpm build

      - name: Package deployment bundle
        run: |
          TAG="${GITHUB_REF_NAME}"
          # UI_DIST_DIR 固定为 <PACKAGE_ROOT>/../ui/dist，因此 ui/ 与 ssmanager-web/ 平级
          mkdir -p release/ssmanager-web release/ui
          cp -R api/dist release/ssmanager-web/dist
          cp -R ui/dist release/ui/dist
          cp api/config.example.json release/ssmanager-web/config.example.json
          cp api/README.md release/ssmanager-web/README.md
          tar -C release -czf "ssmanager-web-${TAG}.tar.gz" ssmanager-web ui
          ls -lh "ssmanager-web-${TAG}.tar.gz"

      - name: Generate release notes from commits between tags
        run: |
          set -euo pipefail
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || true)"
          {
            echo "## 变更内容"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "自 \`${PREV_TAG}\` 以来的提交："
              echo
              git log "${PREV_TAG}..${CURRENT_TAG}" --no-merges --pretty=format:'- %s (`%h`)'
              echo
              echo
              echo "**完整对比**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${CURRENT_TAG}"
            else
              echo "首个版本的提交："
              echo
              git log "${CURRENT_TAG}" --no-merges --pretty=format:'- %s (`%h`)'
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ssmanager-web-*.tar.gz
          body_path: RELEASE_NOTES.md

  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ssmanager-web" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
